version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intelliwealth_postgres
    restart: always
    environment:
      POSTGRES_USER: intelliwealth
      POSTGRES_PASSWORD: intelliwealth_secret_db_pass
      POSTGRES_DB: intelliwealth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliwealth_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://intelliwealth:intelliwealth_secret_db_pass@postgres:5432/intelliwealth_db
      - SECRET_KEY=intelliwealth_super_secret_jwt_key_2026_change_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelliwealth_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
